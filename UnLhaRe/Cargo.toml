[package]
name = "unlhare"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "64-bit cross-platform LHA library and command-line tool"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "unlhare-cli"
path = "src/main.rs"

[dependencies]
cap-std = "4.0.3"
cap-tempfile = "4.0.3"
clap = { version = "4", features = ["derive"] }
delharc = { version = "0.8.0", features = ["lhx", "no-unsafe-assertions"] }
encoding_rs = "0.8"
oxiarc-lzhuf = "0.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
